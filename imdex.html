<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Naija News Hub</title>

  <!-- ================= CSS ================= -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    /* Header */
    header {
      background: #006600;
      color: #fff;
    }

    nav {
      max-width: 1200px;
      margin: auto;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
    }

    /* Navigation */
    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
    }

    /* Dropdown */
    .dropdown {
      position: relative;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: #fff;
      top: 100%;
      left: 0;
      min-width: 160px;
      border-radius: 4px;
      overflow: hidden;
      z-index: 10;
    }

    .dropdown-content a {
      display: block;
      padding: 10px;
      color: #000;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Search */
    .search-container input {
      padding: 7px;
      border-radius: 4px;
      border: none;
      outline: none;
    }

    /* Hero */
    .hero {
      background: #fff;
      padding: 50px 20px;
      text-align: center;
    }

    .hero h1 {
      margin-bottom: 10px;
    }

    /* News Grid */
    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .category-title {
      grid-column: 1 / -1;
      margin: 30px 0 10px;
      color: #006600;
      font-size: 1.4rem;
    }

    /* Card */
    .card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .card-content p {
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    /* Footer */
    footer {
      background: #006600;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }

    /* Mobile */
    .hamburger {
      display: none;
      font-size: 1.6rem;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
        position: absolute;
        background: #006600;
        right: 0;
        top: 60px;
        flex-direction: column;
        width: 200px;
        padding: 10px;
      }

      .nav-links.show {
        display: flex;
      }

      .hamburger {
        display: block;
      }
    }
  </style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header>
  <nav>
    <div class="logo">Naija News Hub</div>

    <div class="search-container">
      <input type="search" id="searchInput" placeholder="Search news..." />
    </div>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>

      <li class="dropdown">
        <a href="#">Categories</a>
        <div class="dropdown-content">
          <a href="#">Political</a>
          <a href="#">Crime</a>
          <a href="#">Sports</a>
          <a href="#">Education</a>
          <a href="#">Forex & Crypto</a>
        </div>
      </li>

      <li><a href="#">About</a></li>
      <li><a href="#">Signup</a></li>
      <li><a href="#">Login</a></li>
    </ul>

    <div class="hamburger" id="hamburger">☰</div>
  </nav>
</header>

<!-- ================= MAIN ================= -->
<main>
  <section class="hero">
    <h1>Latest Nigerian News</h1>
    <p>Trusted updates from Port Harcourt to Abuja</p>
  </section>

  <div class="grid" id="newsGrid"></div>
</main>

<!-- ================= FOOTER ================= -->
<footer>
  © 2026 Naija News Hub • Made with ❤️ in Rivers State
</footer>

<!-- ================= JAVASCRIPT ================= -->
<script>
  /* ================= API CONFIG ================= */
  const API_KEY = "9e513f11faeb486ebc39ba1a5345c266";
  // Example usage later:
  // fetch(`https://newsapi.org/v2/top-headlines?country=ng&apiKey=${API_KEY}`)

  /* ================= SAMPLE DATA ================= */
  const newsData = [
    {
      id: 1,
      title: "Federal Government Announces New Policy",
      excerpt: "The Federal Government has announced a new policy affecting Nigerians.",
      date: "Feb 5, 2026",
      cat: "Political"
    },
    {
      id: 2,
      title: "Police Arrest Suspects in Lagos",
      excerpt: "Police have arrested suspects involved in a major crime operation.",
      date: "Feb 4, 2026",
      cat: "Crime"
    },
    {
      id: 3,
      title: "Super Eagles Win Friendly Match",
      excerpt: "Nigeria’s Super Eagles secured a victory in an international friendly.",
      date: "Feb 3, 2026",
      cat: "Sports"
    },
    {
      id: 4,
      title: "WAEC Releases Examination Timetable",
      excerpt: "WAEC has released the official timetable for upcoming exams.",
      date: "Feb 2, 2026",
      cat: "Education"
    },
    {
      id: 5,
      title: "Bitcoin Hits New High in Nigeria",
      excerpt: "Crypto adoption continues to rise as Bitcoin reaches new highs.",
      date: "Feb 1, 2026",
      cat: "Forex & Crypto"
    }
  ];

  /* ================= NAV TOGGLE ================= */
  const hamburger = document.getElementById("hamburger");
  const navLinks = document.querySelector(".nav-links");

  hamburger.addEventListener("click", () => {
    navLinks.classList.toggle("show");
  });

  /* ================= RENDER NEWS ================= */
  const grid = document.getElementById("newsGrid");
  const categories = ["Political", "Crime", "Sports", "Education", "Forex & Crypto"];

  categories.forEach(category => {
    const title = document.createElement("h2");
    title.className = "category-title";
    title.textContent = category;
    grid.appendChild(title);

    newsData
      .filter(item => item.cat === category)
      .slice(0, 2)
      .forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="https://picsum.photos/400/220?random=${item.id}" alt="${item.title}">
          <div class="card-content">
            <h3>${item.title}</h3>
            <p>${item.excerpt}</p>
            <small>${item.date}</small>
          </div>
        `;

        grid.appendChild(card);
      });
  });
</script>

</body>
</html>
